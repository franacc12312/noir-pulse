name: Aztec Pulse Sync

on:
  schedule:
    - cron: "0 6 * * *" # Every day at 6 AM UTC
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Repos per batch (0 = all)"
        required: false
        default: "0"
      batch_offset:
        description: "Offset for batch processing"
        required: false
        default: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    concurrency:
      group: aztec-pulse-sync
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Validate sync environment
        run: npx tsx scripts/validate-env.ts

      - name: Discover Repos
        run: npx tsx scripts/discover-repos.ts

      - name: Sync Commits
        run: npx tsx scripts/sync-commits.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '0' }}
          BATCH_OFFSET: ${{ github.event.inputs.batch_offset || '0' }}

      - name: Aggregate Stats
        run: npx tsx scripts/aggregate.ts

      - name: Sync TVL
        run: npx tsx scripts/sync-tvl.ts

      - name: Record monthly sync heartbeat
        if: success() && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Heartbeat skipped: not the first day of the month."
            exit 0
          fi

          printf '{"lastSync":"%s"}\n' "$(date -u +%FT%TZ)" > .github/sync-heartbeat.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/sync-heartbeat.json
          git diff --cached --quiet || git commit -m "chore: record sync heartbeat"
          git push
